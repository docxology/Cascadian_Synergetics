# Manuscript configuration for Cascadian Synergetics.
#
# The docxology/template renderer loads this file with yaml.safe_load for the
# title page and the publication metadata, and rejects any manuscript token
# that survives here, so every value is literal. paper.version and
# publication.intended_version must equal package.json and CITATION.cff, and
# release_status must be one the template accepts. last_published_version and
# version_doi come together, a published paper's last published version is
# its version, and CITATION.cff's doi is that version's DOI. `node
# tools/facts.mjs --check` enforces all of it.

paper:
  title: "Cascadian Synergetics"
  subtitle: "Synergetic Geometry, Shown and Checked, in Two Browser Games"
  version: "0.4.0"
  date: ""  # left empty: the renderer stamps the build date
  cover:
    image: "../../output/figures/fig_cover.png"
    alt: "Struts of the isotropic vector matrix fade into a fog-blue ground around an icosahedron drawn in cyan and brass. The lattice and the icosahedron are the field station's own, computed by the game's geometry code."

rendering:
  section_breaks: true
  include_date: true
  cover_height_fraction: 0.55
  figure_height_fraction: 0.46

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    corresponding: true

publication:
  release_status: "published"
  intended_version: "0.4.0"
  last_published_version: "0.4.0"
  doi: "10.5281/zenodo.24508082"  # concept DOI, every archived release; the cover prints it
  version_doi: "10.5281/zenodo.24508085"
  version_record: "https://zenodo.org/records/24508085"
  github_repository: "docxology/Cascadian_Synergetics"
  repository_url: "https://github.com/docxology/Cascadian_Synergetics"
  journal: ""
  volume: ""
  pages: ""
  year: "2026"
  transmission_bookends:
    enabled: false

keywords:
  - "synergetics"
  - "Buckminster Fuller"
  - "quadray coordinates"
  - "isotropic vector matrix"
  - "tetravolume"
  - "jitterbug"
  - "A quanta modules"
  - "browser games"
  - "Cascadia"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"
  tagged_pdf: true

render:
  formats:
    pdf: true
    html: false
    slides: false
    docx: false
    epub: false

llm:
  reviews:
    enabled: false
  translations:
    enabled: false

steganography:
  enabled: false
